name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
          # The SSE4.1 and AVX2 kernels are compiled only with these flags, so this entry keeps them building.
          - cc: gcc
            cxx: g++
            extra_flags: "-msse4.1 -mavx2"
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang cmake libasound2-dev libudev-dev
    - name: Configure
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        EXTRA_FLAGS: ${{ matrix.extra_flags }}
      run: scripts/ci.sh configure
    - name: Build
      run: scripts/ci.sh build
    - name: Test
      run: scripts/ci.sh test
    - name: Install
      run: scripts/ci.sh install

  linux-aarch64:
    # Native AArch64 build and test on GitHub's arm64 runner.  Matches the
    # target architecture; it does not measure realtime performance, which is
    # checked on the boards.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libudev-dev
    - name: Configure
      env:
        GENERATOR: Ninja
      run: scripts/ci.sh configure
    - name: Build
      run: scripts/ci.sh build
    - name: Test
      run: scripts/ci.sh test
