name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
          # The SSE4.1 and AVX2 kernels are compiled only with these flags, so this entry keeps them building.
          - cc: gcc
            cxx: g++
            extra_flags: "-msse4.1 -mavx2"
          # Debug keeps the asserts enabled. The Release builds compile them out, which hid stale names in asserts.
          - cc: gcc
            cxx: g++
            build_type: Debug
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential clang cmake libasound2-dev libudev-dev
    - name: Configure
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        EXTRA_FLAGS: ${{ matrix.extra_flags }}
        BUILD_TYPE: ${{ matrix.build_type }}
      run: scripts/ci.sh configure
    - name: Build
      run: scripts/ci.sh build
    - name: Test
      run: scripts/ci.sh test
    - name: Install
      run: scripts/ci.sh install

  linux-rtsan:
    # Clang RealtimeSanitizer (-fsanitize=realtime). The clang in Ubuntu is too
    # old for RTSan, so install a pinned Clang 21 from apt.llvm.org.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install clang 21 and dependencies
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build libasound2-dev libudev-dev
    - name: Configure
      env:
        CC: clang-21
        CXX: clang++-21
        RTSAN: 'ON'
      run: scripts/ci.sh configure
    - name: Build
      run: scripts/ci.sh build
    - name: Unit tests
      run: scripts/ci.sh test
    - name: Realtime sanitizer e2e
      run: scripts/ci.sh test-rtsan

  linux-aarch64:
    # Native AArch64 build and test on GitHub's arm64 runner.  Matches the
    # target architecture; it does not measure realtime performance, which is
    # checked on the boards.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libudev-dev
    - name: Configure
      env:
        GENERATOR: Ninja
      run: scripts/ci.sh configure
    - name: Build
      run: scripts/ci.sh build
    - name: Test
      run: scripts/ci.sh test
